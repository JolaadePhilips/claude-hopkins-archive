name: Enrich swipe context

on:
  push:
    paths:
      - 'data/archive.json'
      - 'scripts/enrich_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Add OCR-assisted swipe context
        run: python scripts/enrich_manifest.py
      - name: Commit enriched metadata
        run: |
          git config user.name "hopkins-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "Enrich Hopkins swipe context"
            git pull --rebase origin main
            git push origin main
          fi
